<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Video Player</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <div class="header">
            <h1>Custom Video Player</h1>
            <select id="theme" aria-label="Theme">
                <option value="midnight" selected>Midnight</option>
                <option value="pink">Pink</option>
                <option value="solar">Solar</option>
            </select>
        </div>
        <figure class="player">
            <video id="video" preload="metadata" poster="media/poster.png">
                <source src="media/short_clip.mp4" type="video/mp4" />
                <track kind="captions" src="media/caption.vtt" srclang="en" label="English" default />
                Sorry, your browser doesn’t support HTML5 video.
            </video>
            <div class="controls" role="group" aria-label="Player controls">
                <button id="play" class="btn" aria-label="Play">▶</button>
                <button id="pause" class="btn" aria-label="Pause">❚❚</button>
                <button id="back10" class="btn" aria-label="Back 10 seconds">⟲10</button>
                <button id="fwd10" class="btn" aria-label="Forward 10 seconds">10⟳</button>
                <input id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="Seek timeline"/>
                <span id="time" aria-live="polite">0:00 / 0:00</span>
                    
                <select id="speed" aria-label="Playback speed">
                    <option value="0.75">0.75×</option>
                    <option value="1" selected>1×</option>
                    <option value="1.25">1.25×</option>
                    <option value="1.5">1.5×</option>
                    <option value="2">2×</option>
                </select>
                <input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume" />
                <button id="cc" class="btn" aria-label="Toggle captions">CC</button>
                <button id="pip" class="btn" aria-label="Picture in Picture">PiP</button>
                <button id="fs" class="btn" aria-label="Fullscreen">⛶</button>
            </div>
        </figure>
    </main>
<script src="js/app.js" defer></script>
</body>
</html>
